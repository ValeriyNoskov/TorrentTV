name: Release

# Мердж в release -> сборка APK и публикация GitHub Release.
# Приложение на устройствах само находит этот релиз через GitHub API
# и предлагает обновление (UpdateManager.kt).
on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Сборка и публикация релиза
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Извлечь версию
        id: version
        run: |
          V=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | sed 's/versionName = "//;s/"//')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Версия приложения: $V"

      - name: Сборка APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Переименовать APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/VNosKino-${{ steps.version.outputs.version }}.apk

      - name: Опубликовать GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release VNosKino v${{ steps.version.outputs.version }}
          files: dist/VNosKino-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

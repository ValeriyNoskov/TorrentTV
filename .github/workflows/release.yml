name: Release

# Мердж в release -> сборка ПОДПИСАННОГО APK (release-ключ) и публикация GitHub Release.
# Приложение на устройствах само находит этот релиз через GitHub API
# и предлагает обновление (UpdateManager.kt).
#
# Подпись: секрет KEYSTORE_B64 (base64 keystore) + пароли; без подписи
# обновление конфликтует с ранее установленной версией по подписи.
on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Сборка и публикация релиза
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Извлечь версию
        id: version
        run: |
          V=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | sed 's/versionName = "//;s/"//')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Версия приложения: $V"

      - name: Восстановить ключ подписи
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/release-keystore.jks
          ls -la keystore/
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Сборка подписанного APK
        run: >
          ./gradlew assembleRelease --stacktrace
          -PghEmbeddedToken="$GH_EMBEDDED_TOKEN"
          -PkapiKey="$KP_API_KEY"
          -PtraktClientId="$TRAKT_CLIENT_ID"
          -PtorboxKey="$TORBOX_KEY"
        env:
          VNOSKINO_KEYSTORE: ${{ github.workspace }}/keystore/release-keystore.jks
          VNOSKINO_STORE_PASSWORD: ${{ secrets.KS_STORE_PASSWORD }}
          VNOSKINO_KEY_PASSWORD: ${{ secrets.KS_KEY_PASSWORD }}
          VNOSKINO_KEY_ALIAS: vnoskino
          GH_EMBEDDED_TOKEN: ${{ secrets.GH_EMBEDDED_TOKEN }}
          KP_API_KEY: ${{ secrets.KP_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TORBOX_KEY: ${{ secrets.TORBOX_KEY }}

      - name: Переименовать APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/VNosKino-${{ steps.version.outputs.version }}.apk

      - name: Опубликовать GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release VNosKino v${{ steps.version.outputs.version }}
          files: dist/VNosKino-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Опубликовать GitVerse Release (быстрое зеркало для РФ)
        if: env.GITVERSE_TOKEN != ''
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          VER: ${{ steps.version.outputs.version }}
        # GitVerse периодически лежит: зеркало НЕ должно валить релиз —
        # GitHub-публикация уже состоялась, пропускаем с предупреждением
        run: |
          if ! curl -s -m 15 -o /dev/null -H "Authorization: Bearer $GITVERSE_TOKEN" \
               -H "Accept: application/vnd.gitverse.object+json;version=1" \
               "https://api.gitverse.ru/repos/ChipN/TorrentTV"; then
            echo "::warning::GitVerse недоступен — публикация зеркала пропущена"
            exit 0
          fi
          API="https://api.gitverse.ru/repos/ChipN/TorrentTV"
          AH="Authorization: Bearer $GITVERSE_TOKEN"
          AH2="Accept: application/vnd.gitverse.object+json;version=1"
          SHA=$(git rev-parse HEAD)
          curl -sf -m 60 -X POST -H "$AH" -H "$AH2" -H "Content-Type: application/json" \
            "$API/git/refs" \
            -d "{\"ref\":\"refs/tags/v$VER\",\"sha\":\"$SHA\"}" > /dev/null || true
          REL_ID=$(curl -sf -m 60 -X POST -H "$AH" -H "$AH2" -H "Content-Type: application/json" \
            "$API/releases" \
            -d "{\"tag_name\":\"v$VER\",\"name\":\"v$VER\",\"body\":\"Обновление v$VER. APK также на GitHub.\"}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])" 2>/dev/null) || {
            echo "::warning::GitVerse: релиз не создался — пропускаю"
            exit 0
          }
          echo "GitVerse release id=$REL_ID"
          curl -sf -m 600 -X POST -H "$AH" -H "$AH2" \
            "$API/releases/$REL_ID/assets?name=VNosKino-$VER.apk" \
            -F "attachment=@dist/VNosKino-$VER.apk" > /dev/null \
            || echo "::warning::GitVerse: ассет не загрузился"

name: Tests

# Все тесты гоняются в тестовой ветке (и для страховки — на PR в release/main)
on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, release, main]

jobs:
  unit-tests:
    name: Unit-тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unit-тесты
        run: ./gradlew test --stacktrace

      - name: Сборка debug-APK (проверка компиляции)
        run: ./gradlew assembleDebug --stacktrace

      - name: Артефакт APK (тестовая сборка)
        uses: actions/upload-artifact@v4
        with:
          name: torrenttv-test-apk
          path: app/build/outputs/apk/debug/*.apk
